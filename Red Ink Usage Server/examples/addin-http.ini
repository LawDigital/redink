; Configuration fragment: merge into the appropriate existing redink.ini settings.
; Replace host, token and (for classic licences) organization scope.
LicenseCounterPath=https://usage.example.org/collect/REPLACE_WITH_INGESTION_TOKEN
LicenseCounterMethod=WebExtended;RequireAck=true;NetworkScope=example.org
; Check/retry minutes: default360, 0=startup only. A positive interval also checks day changes.
; Successful same-day reports are deduplicated. Restart Office after changing.
LicenseCounterIntervall=360
LicenseCounterAnon=True
