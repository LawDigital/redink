UpdateIniAllowRemote=True
UpdateIniNoSignature=False
UpdateSource=https://usage.example.org/config/REPLACE_WITH_CONFIGURATION_TOKEN/redink.ini; all; REPLACE_WITH_EXISTING_ED25519_PUBLIC_KEY

