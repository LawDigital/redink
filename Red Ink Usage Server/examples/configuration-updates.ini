; UpdateSource=https://usage.example.org/config/REPLACE_WITH_CONFIGURATION_TOKEN/allmodels.ini; all; REPLACE_WITH_EXISTING_ED25519_PUBLIC_KEY

; In each appropriate LOCAL specialservices.ini segment:
; UpdateSource=https://usage.example.org/config/REPLACE_WITH_CONFIGURATION_TOKEN/specialservices.ini; all; REPLACE_WITH_EXISTING_ED25519_PUBLIC_KEY

; The server also supplies all three filenames for any already supported direct-download route.
