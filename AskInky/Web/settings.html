<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Red Ink</title><link rel="stylesheet" href="office-web.css"><link rel="stylesheet" href="desktop.css">
<script src="common.js" defer></script><script src="settings.js" defer></script>
</head>
<body>
<main class="desktop-settings" aria-busy="false">
<div class="settings-scroll">
    <section class="settings-group settings-grid">
        <div><label for="language-select" class="ms-font-s section-label" data-text="settings.language"></label>
            <select id="language-select" class="dropdown"><option value="en">E – English</option><option value="de">D – Deutsch</option><option value="fr">F – Français</option><option value="it">IT – Italiano</option></select></div>
        <div><span class="ms-font-s section-label" data-text="settings.appearance"></span>
            <label class="settings-toggle-row" for="dark-mode-toggle"><span class="settings-toggle-label" data-text="settings.darkMode"></span><span class="settings-toggle-switch"><input type="checkbox" id="dark-mode-toggle"><span class="settings-toggle-slider" aria-hidden="true"></span></span></label></div>
    </section>
    <section class="settings-group">
        <label for="hotkey-display" class="ms-font-s section-label" data-text="desktop.shortcut"></label>
        <div class="hotkey-display"><input id="hotkey-display" class="text-input" readonly data-title="desktop.recordShortcut" autocomplete="off"><button id="reset-hotkey" class="quick-access-btn" type="button" data-text="desktop.default" data-title="desktop.resetShortcut"></button></div>
        <div class="hotkey-options"><label><input id="hotkey-ctrl" type="checkbox">Ctrl</label><label><input id="hotkey-shift" type="checkbox">Shift</label><label><input id="hotkey-alt" type="checkbox">Alt</label><select id="hotkey-key" class="dropdown" data-title="desktop.shortcutKey"></select></div>
        <p class="ms-font-xs status-text" data-text="desktop.shortcutHelp"></p>
    </section>
    <section class="settings-group">
        <label class="ms-font-s section-label" data-text="settings.helperService"></label>
        <div class="helper-status-row connection-top"><span class="connection-value"><span id="connection-dot" class="connection-dot" aria-hidden="true"></span><span id="connection-state" data-text="desktop.notTested"></span></span><button id="btn-test-connection" class="action-btn-small" type="button" data-text="settings.test"></button></div>
        <div class="settings-control"><label for="settings-helper-url" class="ms-font-s section-label" data-text="settings.helperUrl"></label><input type="text" id="settings-helper-url" class="text-input" placeholder="http://localhost" spellcheck="false" autocomplete="off"><p class="ms-font-xs status-text" data-text="settings.helperUrlHint"></p></div>
        <div class="settings-control"><label for="settings-helper-apikey" class="ms-font-s section-label" data-text="settings.helperApiKey"></label><input type="password" id="settings-helper-apikey" class="text-input" maxlength="16384" autocomplete="off" spellcheck="false"><p class="ms-font-xs status-text" data-text="settings.helperApiKeyHint"></p></div>
    </section>
    <section class="settings-group">
        <label for="settings-registration-link" class="ms-font-s section-label" data-text="settings.deviceRegistration"></label>
        <p id="registration-state" class="ms-font-xs status-text"></p>
        <input type="text" id="settings-registration-link" class="text-input" maxlength="32768" spellcheck="false" autocomplete="off" data-placeholder="settings.registrationLinkPlaceholder">
        <div class="registration-actions"><button id="btn-register-device" class="action-btn-link" type="button" data-text="settings.registerDevice"></button><button id="btn-unregister-device" class="action-btn-link" type="button" data-text="settings.unregisterDevice"></button></div>
        <p class="ms-font-xs status-text" data-text="settings.deviceRegistrationHint"></p>
    </section>
    <section class="settings-group">
        <label for="settings-license-user" class="ms-font-s section-label" data-text="settings.license"></label>
        <input type="text" id="settings-license-user" name="redink-license-user" class="text-input" maxlength="1024" autocomplete="off" autocapitalize="none" spellcheck="false" data-placeholder="settings.licenseUserPlaceholder">
        <p id="license-status" class="ms-font-xs status-text"></p><p class="ms-font-xs status-text" data-text="settings.licenseUserHint"></p>
    </section>
    <details class="settings-group settings-disclosure"><summary data-text="desktop.moreSettings"></summary>
        <div class="disclosure-body">
            <div class="settings-control"><label for="font-size" class="ms-font-s section-label" data-text="settings.fontSize"></label><div class="slider-row"><input type="range" id="font-size" min="6" max="16" value="12"><span id="font-size-value">12 px</span></div></div>
            <div class="settings-control"><label for="temperature" class="ms-font-s section-label" data-text="settings.temperature"></label><div class="slider-row"><input type="range" id="temperature" min="0" max="100" value="70"><span id="temperature-value">0.7</span></div></div>
            <div class="settings-control"><label for="system-prompt" class="ms-font-s section-label" data-text="desktop.systemPrompt"></label><textarea id="system-prompt" class="text-input" rows="3" maxlength="200000"></textarea></div>
            <div class="settings-control"><label class="settings-toggle-row" for="settings-show-llm-debug"><span class="settings-toggle-label" data-text="settings.showLlmDebug"></span><span class="settings-toggle-switch"><input type="checkbox" id="settings-show-llm-debug"><span class="settings-toggle-slider" aria-hidden="true"></span></span></label>
            <p class="ms-font-xs status-text" data-text="desktop.debugHint"></p>
            <div id="settings-llm-debug-panel" hidden><label class="ms-font-xs section-label" data-text="settings.debugSent"></label><pre id="debug-sent" class="config-display settings-debug-output"></pre><label class="ms-font-xs section-label" data-text="settings.debugReceived"></label><pre id="debug-received" class="config-display settings-debug-output"></pre></div></div>
        </div>
    </details>
    <div class="settings-footnote"><p data-text="desktop.secretHint"></p></div>
</div>
<footer class="settings-actions"><span id="status" class="desktop-status" role="status" aria-live="polite"></span><button id="cancel-settings" type="button" class="quick-access-btn" data-text="desktop.cancel"></button><button id="save-settings" type="button" class="action-btn-primary" data-text="desktop.save"></button></footer>
</main>
</body></html>
